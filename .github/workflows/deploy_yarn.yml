name: Deploy Next.js to Lightsail with Nginx (yarn)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Clean common build outputs
        run: |
          rm -rf .next node_modules
          rm -rf ~/.npm
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ensure yarn is installed
        run: |
          if ! command -v yarn >/dev/null 2>&1; then
            corepack enable || true
            npm install -g yarn
          fi
          yarn --version

      - name: Install dependencies & build
        run: |
          yarn install --immutable || yarn install --frozen-lockfile || yarn install
          yarn build

      - name: Prepare deploy archive
        run: |
          mkdir deploy_package
          cp -r .next/standalone/* deploy_package/
          mkdir -p deploy_package/.next
          cp -r .next/static deploy_package/.next/
          cp -r public deploy_package/
          cp myfile.txt deploy_package/
          # Copy ecosystem file if it exists in repo
          cp ecosystem.config.js deploy_package/ 2>/dev/null || true
          # Copy .env.production if using environment variables
          cp .env.production deploy_package/.env 2>/dev/null || true
          cd deploy_package
          tar -czf ../deploy.tar.gz .

      - name: Deploy to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy.tar.gz"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy and restart services on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Ensure Node.js v24 is active on the deployment host.
            if command -v nvm >/dev/null 2>&1; then
              nvm install 24
              nvm use 24
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is not installed on the deployment host. Install Node.js v24 and retry."
              exit 1
            fi

            NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
            if [ "$NODE_MAJOR" -ne 24 ]; then
              echo "Expected Node.js v24 on deployment host, found $(node -v)."
              exit 1
            fi

            # Extract deployment package
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Stop existing PM2 process
            pm2 delete nextjs-app 2>/dev/null || true

            # Start with ecosystem file if exists, otherwise run standalone server
            if [ -f "ecosystem.config.js" ]; then
              pm2 start ecosystem.config.js
            else
              pm2 start server.js --name "nextjs-app"
            fi

            # Save PM2 configuration
            pm2 save

            # Reload Nginx to ensure it picks up any configuration changes
            sudo nginx -t && sudo systemctl reload nginx

            # Optional: Clear Nginx cache if you have caching enabled
            # sudo rm -rf /var/cache/nginx/*

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            pm2 status
            curl -I http://localhost:3000  # Check if Next.js is responding
            curl -I http://localhost         # Check if Nginx proxy is working
