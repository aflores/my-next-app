name: Deploy Next.js to Lightsail with Nginx

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Prepare deploy archive
        run: |
          mkdir deploy_package
          cp -r .next deploy_package/
          cp -r public deploy_package/
          cp package.json package-lock.json next.config.js deploy_package/
          # Copy ecosystem file if it exists in repo
          cp ecosystem.config.js deploy_package/ 2>/dev/null || true
          # Copy .env.production if using environment variables
          cp .env.production deploy_package/.env 2>/dev/null || true
          cd deploy_package
          tar -czf ../deploy.tar.gz .

      - name: Deploy to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy.tar.gz"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy and restart services on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Extract deployment package
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # Install production dependencies only
            npm ci --omit=dev
            
            # Stop existing PM2 process
            pm2 delete nextjs-app 2>/dev/null || true
            
            # Start with ecosystem file if exists, otherwise use npm start
            if [ -f "ecosystem.config.js" ]; then
              pm2 start ecosystem.config.js
            else
              pm2 start npm --name "nextjs-app" -- start
            fi
            
            # Save PM2 configuration
            pm2 save
            
            # Reload Nginx to ensure it picks up any configuration changes
            sudo nginx -t && sudo systemctl reload nginx
            
            # Optional: Clear Nginx cache if you have caching enabled
            # sudo rm -rf /var/cache/nginx/*
      
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            pm2 status
            curl -I http://localhost:3000  # Check if Next.js is responding
            curl -I http://localhost         # Check if Nginx proxy is working
